<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Scanner Tiket Gate - Bingkai Bisu 2026</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0b0217; color: #ffffff; font-family: ui-sans-serif, system-ui, sans-serif; }
    .gold-border { border: 2px solid #FFDC17; box-shadow: 0 0 15px rgba(255, 220, 23, 0.25); }
    #reader { width: 100% !important; border: none !important; border-radius: 1rem; overflow: hidden; }
    #reader video { border-radius: 1rem; object-fit: cover; width: 100% !important; }
    #reader__scan_region { background: transparent !important; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 selection:bg-[#FFDC17] selection:text-[#1A0536]">

  <!-- HEADER & STATUS BAR -->
  <header class="w-full max-w-md space-y-3">
    <div class="flex items-center justify-between border-b border-purple-900/60 pb-3">
      <div class="flex items-center space-x-2">
        <span class="text-xl">📷</span>
        <h1 class="text-base font-extrabold tracking-wider text-[#FFDC17]">SCANNER GATE HETERO</h1>
      </div>
      <a href="admin.html" class="text-xs bg-purple-950 border border-purple-600 px-3 py-1.5 rounded-lg text-purple-200 hover:text-white">Panel Admin &rarr;</a>
    </div>

    <!-- STATS COUNTER -->
    <div class="grid grid-cols-3 gap-2 text-center text-xs">
      <div class="bg-[#1A0536] border border-purple-800/80 p-2.5 rounded-xl">
        <p class="text-slate-400 text-[10px] uppercase font-bold">Koneksi</p>
        <p id="netStatus" class="font-bold text-emerald-400 mt-0.5">● ONLINE</p>
      </div>
      <div class="bg-[#1A0536] border border-purple-800/80 p-2.5 rounded-xl">
        <p class="text-slate-400 text-[10px] uppercase font-bold">Database HP</p>
        <p id="totalLocalTickets" class="font-bold text-[#FFDC17] mt-0.5">0 Tiket</p>
      </div>
      <div class="bg-[#1A0536] border border-purple-800/80 p-2.5 rounded-xl">
        <p class="text-slate-400 text-[10px] uppercase font-bold">Sudah Masuk</p>
        <p id="scannedCount" class="font-bold text-cyan-400 mt-0.5">0 Orang</p>
      </div>
    </div>
  </header>

  <!-- SCANNER CONTAINER -->
  <main class="w-full max-w-md my-auto space-y-4">
    <div class="bg-[#16032e] border-2 border-[#FFDC17]/70 rounded-2xl p-4 shadow-2xl relative">
      <div class="flex items-center justify-between mb-3 text-xs">
        <span class="font-bold text-slate-300 flex items-center gap-1.5">
          <i class="fa-solid fa-expand text-[#FFDC17]"></i> ARAHKAN KE QR TIKET
        </span>
        <button id="btnSwitchCam" class="text-[11px] bg-purple-900/60 hover:bg-purple-800 border border-purple-600 px-2.5 py-1 rounded-md text-amber-300">
          🔄 Ganti Kamera
        </button>
      </div>

      <!-- VIEWPORT KAMERA -->
      <div id="reader" class="bg-black/80 aspect-square flex items-center justify-center"></div>

      <!-- HASIL POPUP STATUS SCAN -->
      <div id="resultBox" class="hidden mt-3 p-3.5 rounded-xl text-center transition-all animate-bounce-short"></div>
    </div>

    <!-- INPUT MANUAL KODE TIKET -->
    <div class="bg-[#1A0536] border border-purple-900/80 rounded-xl p-3 flex gap-2">
      <input type="text" id="manualCodeInput" placeholder="Contoh: BB-BUG2Q" class="bg-purple-950/70 border border-purple-700/80 rounded-lg px-3 py-2 text-xs text-white uppercase tracking-widest flex-1 focus:outline-none focus:border-[#FFDC17]">
      <button id="btnManualCheck" class="bg-[#FFDC17] hover:bg-amber-400 text-[#1A0536] text-xs font-black px-4 py-2 rounded-lg active:scale-95 transition">
        Periksa
      </button>
    </div>

    <!-- TOMBOL OFFLINE PWA / SINKRONISASI -->
    <div class="space-y-2">
      <button id="btnSyncDb" class="w-full bg-[#FFDC17] hover:bg-yellow-400 text-[#1A0536] font-extrabold text-xs py-3 rounded-xl flex items-center justify-center gap-2 shadow-lg active:scale-95 transition">
        <i class="fa-solid fa-cloud-arrow-down text-sm"></i>
        <span>DOWNLOAD / SINKRONKAN DATABASE KE HP</span>
      </button>
      <p id="syncTimeText" class="text-[10px] text-center text-slate-400">Belum pernah sinkronisasi data offline.</p>
    </div>
  </main>

  <footer class="w-full max-w-md text-center py-2 text-[10px] text-purple-400/80">
    PWA Scanner Gate Hetero Space • Bingkai Bisu 2026
  </footer>

  <!-- LOGIKA JAVASCRIPT SCANNER -->
  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRMLG227d09VkqJh__-Prb6HGw_t1JMY14FLLeQHO6kMwq5j1ClzX1kMTfMYOh31zw/exec";
    let html5QrCode = null;
    let isProcessing = false;
    let currentCameraIndex = 0;
    let availableCameras = [];

    // Helper Bersihkan Format Kode
    function cleanCode(code) {
      return (code || "").toString().trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
    }

    // Audio Feedback Generator (Tanpa File Eksternal)
    function playBeep(isSuccess) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        if (isSuccess) {
          osc.frequency.setValueAtTime(880, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(1760, ctx.currentTime + 0.15);
        } else {
          osc.type = "sawtooth";
          osc.frequency.setValueAtTime(300, ctx.currentTime);
          osc.frequency.setValueAtTime(150, ctx.currentTime + 0.2);
        }
        gain.gain.setValueAtTime(0.3, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    // Ambil Data dari LocalStorage
    function getLocalDatabase() {
      try {
        return JSON.parse(localStorage.getItem('offline_tickets') || '[]');
      } catch (e) {
        return [];
      }
    }

    // Update UI Angka Counter
    function refreshStatsUI() {
      const db = getLocalDatabase();
      document.getElementById('totalLocalTickets').innerText = `${db.length} Tiket`;
      const checkedIn = db.filter(t => t.checkin && !t.checkin.includes("BELUM")).length;
      document.getElementById('scannedCount').innerText = `${checkedIn} Orang`;
      const syncTime = localStorage.getItem('last_sync_time');
      if (syncTime) {
        document.getElementById('syncTimeText').innerText = `Terakhir sinkron: ${syncTime}`;
      }
    }

    // Tampilkan Kartu Notifikasi Hasil Scan
    function showScanResult(type, title, subtitle, merchText = "") {
      const box = document.getElementById('resultBox');
      box.className = "mt-3 p-3.5 rounded-xl text-center border-2 block ";

      if (type === "success") {
        playBeep(true);
        box.className += "bg-emerald-950/90 border-emerald-400 text-white";
        box.innerHTML = `
          <div class="text-2xl mb-1">✅</div>
          <h3 class="text-sm font-black text-emerald-300 uppercase">${title}</h3>
          <p class="text-xs font-bold text-white mt-1">${subtitle}</p>
          ${merchText ? `<div class="mt-2.5 p-2 bg-yellow-400 text-purple-950 font-black text-[11px] rounded-lg tracking-wider">🎁 KLAIM SOUVENIR: ${merchText}</div>` : ''}
        `;
      } else if (type === "warning") {
        playBeep(false);
        box.className += "bg-amber-950/90 border-amber-400 text-amber-200";
        box.innerHTML = `
          <div class="text-2xl mb-1">⚠️</div>
          <h3 class="text-sm font-black uppercase">${title}</h3>
          <p class="text-xs mt-1 text-white">${subtitle}</p>
        `;
      } else {
        playBeep(false);
        box.className += "bg-rose-950/90 border-rose-500 text-rose-200";
        box.innerHTML = `
          <div class="text-2xl mb-1">❌</div>
          <h3 class="text-sm font-black uppercase">${title}</h3>
          <p class="text-xs mt-1 text-white">${subtitle}</p>
        `;
      }

      // Reset auto hide setelah 4 detik
      setTimeout(() => {
        isProcessing = false;
      }, 3500);
    }

    // FUNGSI SINKRONISASI / DOWNLOAD DATABASE DARI GOOGLE SHEET
    async function syncDatabase() {
      const btn = document.getElementById('btnSyncDb');
      const oldHtml = btn.innerHTML;
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>MENGUNDUH DARI CLOUD...</span>`;
      btn.disabled = true;

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "download_data" })
        });

        const res = await response.json();

        if (res.status === "SUCCESS") {
          localStorage.setItem('offline_tickets', JSON.stringify(res.data));
          const nowStr = new Date().toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
          localStorage.setItem('last_sync_time', `${nowStr} WIB (${res.total} Tiket)`);
          refreshStatsUI();
          alert(`✅ Berhasil mengunduh ${res.total} data tiket ke HP!\nScanner siap digunakan secara offline.`);
        } else {
          alert(`Gagal mengunduh: ${res.message || "Aksi ditolak server"}`);
        }
      } catch (err) {
        alert("Gagal koneksi: Pastikan internet aktif saat download data awal.");
      } finally {
        btn.innerHTML = oldHtml;
        btn.disabled = false;
      }
    }

    // FUNGSI UTAMA VERIFIKASI KODE TIKET (OFFLINE DULU -> FALLBACK ONLINE)
    async function verifyTicketCode(rawCode) {
      if (isProcessing) return;
      isProcessing = true;

      const code = cleanCode(rawCode);
      if (!code || code.length < 4) {
        showScanResult("error", "KODE TIKET TIDAK VALID", "Format kode QR tidak sesuai.");
        return;
      }

      const db = getLocalDatabase();
      const localIndex = db.findIndex(t => cleanCode(t.kodeTiket) === code);

      // JIKA DITEMUKAN DI DATABASE LOKAL HP
      if (localIndex !== -1) {
        const ticket = db[localIndex];
        const statusCheckin = (ticket.checkin || "").toUpperCase();
        const isTwoDay = (ticket.varian || "").toLowerCase().includes("2 hari");

        if (isTwoDay) {
          if (statusCheckin === "BELUM MASUK" || statusCheckin === "") {
            ticket.checkin = "MASUK (HARI 1)";
            db[localIndex] = ticket;
            localStorage.setItem('offline_tickets', JSON.stringify(db));
            refreshStatsUI();
            sendOnlineUpdate(code); // update background
            const merch = ticket.merch && ticket.merch.ada ? ticket.merch.textScanner : "";
            showScanResult("success", "CHECK-IN HARI 1 BERHASIL", `${ticket.nama} • ${ticket.varian}`, merch);
            return;
          } else if (statusCheckin === "MASUK (HARI 1)") {
            ticket.checkin = "SELESAI (HARI 2)";
            db[localIndex] = ticket;
            localStorage.setItem('offline_tickets', JSON.stringify(db));
            refreshStatsUI();
            sendOnlineUpdate(code);
            showScanResult("success", "CHECK-IN HARI 2 BERHASIL", `${ticket.nama} • ${ticket.varian}`);
            return;
          } else {
            showScanResult("warning", "TIKET 2 HARI TELAH SELESAI", `Tiket ${ticket.nama} sudah dipakai di kedua hari.`);
            return;
          }
        }

        // Tiket 1 Hari
        if (statusCheckin.includes("MASUK") || statusCheckin.includes("SUDAH")) {
          showScanResult("error", "TIKET SUDAH PERNAH DIGUNAKAN!", `Atas Nama: ${ticket.nama} (${ticket.varian})`);
          return;
        }

        ticket.checkin = "SUDAH MASUK";
        db[localIndex] = ticket;
        localStorage.setItem('offline_tickets', JSON.stringify(db));
        refreshStatsUI();
        sendOnlineUpdate(code); // kirim sinkron ke sheet
        const merch = ticket.merch && ticket.merch.ada ? ticket.merch.textScanner : "";
        showScanResult("success", "CHECK-IN BERHASIL!", `${ticket.nama} • ${ticket.varian}`, merch);
        return;
      }

      // JIKA TIDAK DITEMUKAN DI HP, FALLBACK CEK KE SERVER GOOGLE SECARA LANGSUNG
      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "scan_ticket", kodeTiket: code })
        });
        const res = await response.json();

        if (res.status === "SUCCESS") {
          const merch = res.merch && res.merch.ada ? res.merch.textScanner : "";
          showScanResult("success", res.message || "CHECK-IN BERHASIL!", `${res.nama} • ${res.pass}`, merch);
          // Tambahkan ke database lokal agar selanjutnya terbaca offline
          db.push({ kodeTiket: code, nama: res.nama, varian: res.pass, checkin: "SUDAH MASUK" });
          localStorage.setItem('offline_tickets', JSON.stringify(db));
          refreshStatsUI();
        } else if (res.status === "ALREADY_USED") {
          showScanResult("error", "TIKET SUDAH PERNAH DIGUNAKAN!", res.nama || "Tiket Hangus");
        } else if (res.status === "NOT_APPROVED") {
          showScanResult("warning", "TIKET BELUM DI-ACC PANITIA", "Status pembayaran masih PENDING.");
        } else {
          showScanResult("error", "TIKET TIDAK DITEMUKAN", `Kode ${code} tidak ada di database.`);
        }
      } catch (e) {
        showScanResult("error", "TIKET TIDAK ADA DI DATABASE HP", "Tekan tombol 'Download Database' saat ada sinyal internet.");
      }
    }

    // Sinkronisasi background ke Google Sheet jika sedang online
    async function sendOnlineUpdate(code) {
      if (!navigator.onLine) return;
      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "scan_ticket", kodeTiket: code })
        });
      } catch (err) {}
    }

    // Inisialisasi Kamera HTML5-QRCode
    async function initCamera() {
      try {
        const devices = await Html5Qrcode.getCameras();
        if (devices && devices.length > 0) {
          availableCameras = devices;
          // Cari kamera belakang
          const backIndex = devices.findIndex(d => d.label.toLowerCase().includes('back') || d.label.toLowerCase().includes('belakang'));
          currentCameraIndex = backIndex !== -1 ? backIndex : 0;
          startScanner(availableCameras[currentCameraIndex].id);
        } else {
          alert("Kamera tidak ditemukan di perangkat ini.");
        }
      } catch (err) {
        console.error("Gagal inisialisasi kamera:", err);
      }
    }

    function startScanner(cameraId) {
      if (html5QrCode) {
        html5QrCode.stop().then(() => startScannerInstance(cameraId)).catch(() => startScannerInstance(cameraId));
      } else {
        startScannerInstance(cameraId);
      }
    }

    function startScannerInstance(cameraId) {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        cameraId,
        { fps: 12, qrbox: { width: 250, height: 250 }, aspectRatio: 1.0 },
        (decodedText) => verifyTicketCode(decodedText),
        (errorMessage) => {}
      ).catch(err => {
        console.log("Kamera sedang sibuk / gagal start: ", err);
      });
    }

    // EVENT LISTENERS
    document.getElementById('btnSwitchCam').addEventListener('click', () => {
      if (availableCameras.length > 1) {
        currentCameraIndex = (currentCameraIndex + 1) % availableCameras.length;
        startScanner(availableCameras[currentCameraIndex].id);
      } else {
        alert("Hanya 1 kamera yang terdeteksi di perangkat.");
      }
    });

    document.getElementById('btnSyncDb').addEventListener('click', syncDatabase);

    document.getElementById('btnManualCheck').addEventListener('click', () => {
      const input = document.getElementById('manualCodeInput');
      if (input.value.trim()) {
        verifyTicketCode(input.value.trim());
      }
    });

    window.addEventListener('online', () => {
      document.getElementById('netStatus').innerText = "● ONLINE";
      document.getElementById('netStatus').className = "font-bold text-emerald-400 mt-0.5";
    });
    window.addEventListener('offline', () => {
      document.getElementById('netStatus').innerText = "○ OFFLINE";
      document.getElementById('netStatus').className = "font-bold text-amber-400 mt-0.5";
    });

    // Jalankan Saat Halaman Terbuka
    window.addEventListener('DOMContentLoaded', () => {
      refreshStatsUI();
      initCamera();
    });
  </script>
</body>
</html>
